<style>
@font-face{font-family:Plex;src:url('untoldlife/assets/fonts/PlexArabic-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:Plex;src:url('untoldlife/assets/fonts/PlexArabic-SemiBold.ttf') format('truetype');font-weight:600 900;font-display:swap}
:root{--bg:#14100c;--panel:#2a2119;--panel2:#33281d;--line:#57442f;--ink:#f2e5c4;--muted:#c6b08a;--gold:#e2bc6c;--gold2:#c9973f;--green:#a6bd70}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Plex,system-ui,'Segoe UI',Tahoma,'Microsoft YaHei','PingFang SC',sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
:root[lang=zh-Hans] body{font-family:Plex,'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
/* top bar */
.top{position:absolute;inset:0 0 auto 0;z-index:3}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:.5px;text-decoration:none;color:var(--ink)}
.brand-mark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(145deg,var(--gold),var(--gold2));color:#2a1d0e;font-size:14px;font-weight:900;letter-spacing:-.5px;box-shadow:0 2px 0 #0006}
.lang{appearance:none;background:#00000066;color:var(--ink);border:1px solid #ffffff2a;border-radius:9px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer;backdrop-filter:blur(6px)}
.lang option{background:var(--panel);color:var(--ink)}
/* hero */
.hero{position:relative;min-height:440px;display:flex;align-items:flex-end;background:#0b0d14 url('img/hero-night.jpg') center bottom/cover no-repeat;overflow:hidden}
.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#0b0d1499 0%,#14100c00 35%,#14100cdd 80%,var(--bg) 100%)}
.hero .wrap{position:relative;z-index:2;padding-bottom:40px;width:100%}
.hero h1{margin:0;font-size:clamp(34px,6vw,58px);line-height:1.15;font-weight:800;text-shadow:0 3px 18px #000a}
.hero h1 span{color:var(--gold)}
.hero p{margin:10px 0 0;max-width:560px;font-size:clamp(15px,2.2vw,18px);color:#eadbb8;text-shadow:0 2px 10px #000c}
/* sections */
section{padding:34px 0}
h2{font-size:24px;margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 6px 0 #0005}
.cover{position:relative;aspect-ratio:16/8;background:#0d0a07 center/cover no-repeat;display:grid;place-items:center}
.cover img.logo{width:78%;max-width:340px;filter:drop-shadow(0 6px 10px #0009)}
.badge{position:absolute;top:10px;inset-inline-start:10px;background:#000000aa;border:1px solid var(--gold);color:var(--gold);font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px}
.body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.body h3{margin:0;font-size:21px}
.body p{margin:0;color:var(--muted);font-size:15px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 10px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:auto;padding:11px 18px;border-radius:10px;border:0;font:inherit;font-weight:800;font-size:16px;text-decoration:none;cursor:pointer;background:linear-gradient(180deg,#b9d07f,#86a24f);color:#1d250f;box-shadow:0 3px 0 #4f6229}
.btn:hover{filter:brightness(1.07)}
.btn:focus-visible,.lang:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn.gold{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#2a1d0e;box-shadow:0 3px 0 #7a5a22}
.soon .cover{font-size:58px}
.soon .body .btn{background:#ffffff10;color:var(--muted);box-shadow:none;cursor:default}
.kingdom{background:radial-gradient(circle at 50% 120%,#f4c96a 0,#a8742b 30%,#3b1f4f 75%)}
.neon{background:linear-gradient(160deg,#0b0620 0%,#2b0b4a 45%,#09303f 100%);text-shadow:0 0 12px #ff2bd6,0 0 24px #00e5ff}
.neon:after{content:'';position:absolute;inset:auto 0 0 0;height:45%;background:repeating-linear-gradient(90deg,#00e5ff22 0 1px,transparent 1px 28px),repeating-linear-gradient(0deg,#ff2bd622 0 1px,transparent 1px 18px);transform:perspective(200px) rotateX(55deg);transform-origin:bottom}
.feedback{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.feedback h2{margin:0 0 4px}
.feedback p{margin:0;color:var(--muted)}
.feedback .btn{margin:0}
footer{padding:26px 0 40px;color:#8f7b5c;font-size:13px;text-align:center}
footer a{color:#b59d74}
@media (max-width:600px){.hero{min-height:380px}.grid{grid-template-columns:1fr}section{padding:26px 0}}
</style>

  <section id="fbSection" hidden>

</main>

    gamesTitle: 'Our games', beta: 'Beta', ulText: 'Inherit your grandfather\'s farm in Echo Valley. Grow crops, raise animals, dig the mines, fight in the dungeon, and pass the farm down from generation to generation.',

    fbTitle: 'Played our games?', fbText: 'Everything here is in beta, and your feedback matters. Anything you liked, anything that annoyed you, anything that broke — tell us.', fbBtn: '✍️ Send feedback' },

    tag1: 'Fazenda', tag2: 'Gerações', tag3: '6 idiomas', play: '▶ Jogar agora', soon: 'Em breve',

};
const KEY = 'untoldlife_lang'; // shared with the games, so the choice carries over
function getLang() {
  try { const v = localStorage.getItem(KEY); if (v && T[v]) return v; } catch (e) {}
  return 'ar'; // same default as the games
}
function apply(lang) {
  const d = T[lang];
  document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : lang === 'pt' ? 'pt-BR' : lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach(el => { el.innerHTML = d[el.dataset.t]; });
  document.getElementById('lang').value = lang;
}
const sel = document.getElementById('lang');
sel.addEventListener('change', () => { try { localStorage.setItem(KEY, sel.value); } catch (e) {} apply(sel.value); });
if (FEEDBACK_URL && !FEEDBACK_URL.startsWith('__')) {
  document.getElementById('fbLink').href = FEEDBACK_URL;
  document.getElementById('fbSection').hidden = false;
}
document.getElementById('year').textContent = new Date().getFullYear();
apply(getLang());
