<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UntoldLife</title>
<link rel="stylesheet" href="style.css?v=45">
<link rel="stylesheet" href="world-theme.css?v=45">
<link rel="stylesheet" href="assets/art/sky/horizon-mask.css?v=45">
<link rel="stylesheet" href="brand-theme.css?v=45">
<link rel="stylesheet" href="art-pass2.css?v=45">
<script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "d00635426d214e93938126001ce4a104"}'></script>
</head>
<body>
<header id="top">
  <div class="sky">
    <div class="world-sky-decor" aria-hidden="true">
    <div class="stars" id="stars"></div>
    <div class="sun" id="sun"></div>
    <div class="moon" id="moon"></div>
    <div class="distant-hills" aria-hidden="true"></div>
    <div class="hills" id="hills"></div>
    <div class="world-clouds" id="skyClouds" aria-hidden="true"></div>
    </div>
    <div class="world-land world-land-day" aria-hidden="true"></div>
    <div class="world-land world-land-night" aria-hidden="true"></div>
    <canvas id="weatherCanvas" aria-hidden="true"></canvas>
  </div>
  <div class="brand">
    <h1><img class="brand-wordmark" src="assets/art/brand/untoldlife-wordmark.png" width="2172" height="724" alt="UntoldLife" fetchpriority="high" decoding="async"></h1>
    <span class="brand-season-seal" aria-hidden="true"></span>
    <span class="sub">حياة لم تُروَ بعد — <span id="hName"></span></span>
  </div>
  <div class="hud">
    <div class="chip gold"><img class="px" src="assets/coin.svg" width="16" height="16" alt="ذهب"> <b id="hGold">0</b></div>
    <div class="chip" id="hDate"></div>
    <div class="chip" id="hWeather"></div>
    <div class="chip" id="hClock"></div>
    <div class="chip" id="hPhase"></div>
    <div class="chip" id="hGen"></div>
    <div class="chip hidden" id="hCh"></div>
    <button class="chip" id="themeBtn" data-a="theme"></button>
    <button class="chip lang-chip" id="langBtn" data-a="lang"></button>
    <button class="chip fb-chip hidden" id="fbBtn" data-a="feedback"></button>
    <button class="chip au-chip" id="muteBtn" data-a="muteToggle" aria-label="Sound"></button>
  </div>
</header>

<nav id="tabs" aria-label="أماكن القرية"></nav>

<div id="wrap">
  <main id="view"></main>
  <aside id="side">
    <div class="stabs"><button class="stab on" data-a="side" data-v="log"><svg class="ui-icon" data-icon-id="scroll" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 3h14v18H5zM8 7h8m-8 5h8m-8 5h5"/></svg> سجل الأحداث</button><button class="stab" data-a="side" data-v="buffs"><svg class="ui-icon" data-icon-id="sparkle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3Z"/></svg> البفات الحالية</button></div>
    <div id="sideLog"><ul id="log"></ul></div>
    <div id="buffs" class="hidden"></div>
  </aside>
</div>

<div id="effects" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" class="hidden" role="dialog" aria-modal="true" aria-label="رسالة من الوادي"><div class="mbox" id="mbox"></div></div>

<script src="lang-en.js?v=45"></script>
<script src="lang-es.js?v=45"></script>
<script src="lang-pt.js?v=45"></script>
<script src="lang-ru.js?v=45"></script>
<script src="lang-zh.js?v=45"></script>
<script src="i18n.js?v=45"></script>
<script src="assets/sprites.js"></script>
<script src="assets/art.js?v=45"></script>
<script src="assets/cutouts.js?v=45"></script>
<script src="assets/season-portraits.js?v=45"></script>
<script src="assets/legacy-art.js?v=45"></script>
<script src="assets/pass2-art.js?v=45"></script>
<script src="assets/image-metadata.js?v=45"></script>
<script src="asset-labels.js?v=45"></script>
<script src="ui-v2.js?v=45"></script>
<script src="visuals.js?v=45"></script>
<script src="world-scene.js?v=45"></script>
<script src="site-config.js?v=45"></script>
<script src="game.js?v=45"></script>
<script src="tutorial.js?v=45"></script>
<script src="feedback.js?v=45"></script>
<script src="stats.js?v=45"></script>
<script src="move.js?v=45"></script>
<script src="assets/music/tracks.js?v=45"></script>
<script src="audio.js?v=45"></script>
</body>
</html>
